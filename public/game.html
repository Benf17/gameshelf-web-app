<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome/css/fontawesome.css">
    <link rel="stylesheet" href="fontawesome/css/solid.css">
    <link rel="stylesheet" href="app-style.css">
</head>
<body>
    <header class="header-card">
        <h1 class="header-title">
            <i class="fa-solid fa-gamepad header-icon" aria-hidden="true"></i>
            Game Shelf
        </h1>
    </header> 

    <div class="app-body">
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="/game.html" class="active"><i class="fa-solid fa-book-open"></i> Library</a> 
                <a href="/wishlist.html"><i class="fa-regular fa-heart"></i> Wishlist</a>
            </div>
            <div class="logout"><a href=""><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></div>
        </nav>

        <main class="app-content">

            <!-- Library view -->
            <section class="library-view" hidden> 
                <div  class="library-header-container">
                    <h2>My Library</h2>
                    <button type="button" class="add-game-btn"> <i class="fa-solid fa-circle-plus"></i> Add Game</button>
                </div>
                <div class="library-text" hidden>
                    <p>Your library is empty <br>
                        Start adding your games
                    </p>
                </div>
                <div class="games-view">
                    <div class="game-card">
                        <img src="Images/minecraft.jpg" class="game-cover">
                        <div class="game-title">Minecraft</div>
                    </div>
                </div>
            </section>

            <!-- Add game form view -->
            <div class="add-game-view" hidden>
                <section class="add-game-card">
                    <div class="add-game-header">Add Game</div>

                    <form action="" class="add-game-form" id="add-to-library-game-form">
                        <div class="add-game-input">
                            <label for="search-game">Game: </label>
                            <input type="search" id="search-game" name="search-game" placeholder="search game...">
                        </div>
                        <div class="add-game-input">
                            <label for="playtime">Playtime: </label>
                            <input type="text" name="playtime" id="playtime">
                        </div>
                        <div class="add-game-input">
                            <label for="status">Status: </label>
                            <input type="text" name="status" id="status">
                        </div>
                        <div class="add-game-input">
                            <label for="platform">Platform: </label>
                            <input type="text" name="platform" id="platform">
                        </div>
                        <div class="add-game-input">
                            <label for="rating">Rating: </label>
                            <input type="text" name="rating" id="rating">
                        </div>
                        <div class="add-game-input">
                            <label for="comments">Comment: </label>
                            <input type="text" name="comment" id="comment">
                        </div>
                        <div class="add-game-input-btns">
                            <button type="submit">Add Game</button>
                            <button type="button">Cancel</button>
                        </div>
                    </form>
                </section>
            </div>

            <!-- Game details view -->
            <section class="game-details" id="game-details-view">
                <div class="game-banner">
                    <a href="#Library" class="back-to-library"><i class="fa-solid fa-arrow-left"></i> Back to Library</a>
                </div>

                <div class="game-info">
                    <div class="game-cover-container">
                        <img src="Images/minecraft.jpg" class="game-cover-library" alt="Game Cover">
                    </div>

                    <div class="game-details-info">
                        <h2 id="detail-game-name">Minecraft</h2>

                        <p class="game-status" id="detail-status">Playing</p>

                        <p class="game-stat">
                            <i class="fa-solid fa-desktop" aria-hidden="true"></i>
                            <span>
                                <strong>Platform:</strong>
                                <span id="detail-platform">PC</span>
                            </span>
                        </p>

                        <p class="game-stat">
                            <i class="fa-solid fa-clock" aria-hidden="true"></i>
                            <span>
                                <strong>Playtime:</strong>
                                <span id="detail-playtime">100 hours</span>
                            </span>
                        </p>

                        <p class="game-stat">
                            <i class="fa-solid fa-star" aria-hidden="true"></i>
                            <strong>Rating:</strong>
                            <span class="game-rating"
                                id="detail-rating"
                                role="img"
                                aria-label="5 out of 5 stars">
                                <span aria-hidden="true">★★★★★</span>
                            </span>
                        </p>
                    </div>
                </div>

                <div class="game-comment">
                    <h3>Comments</h3>
                    <p id="detail-comment">No comments yet.</p>
                </div>

                <div class="game-actions">
                    <button type="button" id="update-game-btn">
                        <i class="fa-solid fa-pen" aria-hidden="true"></i>
                        Update
                    </button>

                    <button type="button" id="remove-game-btn">
                        <i class="fa-solid fa-trash" aria-hidden="true"></i>
                        Remove
                    </button>
                </div>

            </section>
        </main>
    </div>
    <script src="scripts/game.js"></script>
</body>
</html>
